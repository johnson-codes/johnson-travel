<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Johnson's Journey — an interactive travel album of places, photos, and personal stories." />
  <title>Johnson’s Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,650&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="content-rail masthead-inner">
      <div class="masthead-brand">
        <h1 class="brand">Johnson’s <span>Journey</span></h1>
      </div>
      <dl class="stats" aria-label="Travel statistics">
        <div class="stat">
          <dt>Countries</dt>
          <dd id="stat-countries">0</dd>
        </div>
        <div class="stat">
          <dt>Journeys</dt>
          <dd id="stat-journeys">0</dd>
        </div>
        <div class="stat">
          <dt>Years</dt>
          <dd id="stat-years">0</dd>
        </div>
      </dl>
    </div>
  </header>

  <main class="map-stage">
    <div class="content-rail">
      <div class="map-card">
        <section class="toolbar" aria-label="Filter journeys">
          <div class="toolbar-filters">
            <div class="field">
              <label for="filter-country">Country</label>
              <select id="filter-country"></select>
            </div>
            <div class="field">
              <label for="filter-year">Year</label>
              <select id="filter-year"></select>
            </div>
            <div class="field">
              <label for="filter-status">Status</label>
              <select id="filter-status"></select>
            </div>
            <button type="button" class="reset-btn" id="filter-reset">Reset</button>
          </div>
          <p class="result-count" id="result-count" aria-live="polite">0 journeys shown</p>
        </section>

        <section class="map-section" aria-label="Interactive journey map">
          <div class="map-shell">
            <div id="map" role="application" aria-label="World map of journeys"></div>
            <div class="map-fallback" id="map-fallback">
              <div class="fallback-card">
                <p class="fallback-kicker">Almost there</p>
                <h2>Add a Google Maps API key to unlock the map</h2>
                <p data-fallback-message>
                  Put your key in <code>js/config.js</code>, restrict it by domain, then refresh.
                </p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="content-rail">
      <p>Johnson’s Journey</p>
    </div>
  </footer>

  <script src="js/config.js?v=2"></script>
  <script src="js/journeys.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
